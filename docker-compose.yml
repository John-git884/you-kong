services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: youkong
      MYSQL_DATABASE: youkong
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pyoukong"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: youkong
      # 上线务必替换成随机值：openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-secret-change-me-please}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-youkong123}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
